# Victim-mirror of withastro/compiler .github/workflows/release.yml
# Modifications from upstream (minimal, all documented):
#   - `name:` and job names scrubbed to generic strings (opsec §11)
#   - `github.repository_owner == 'withastro'` guard dropped from the job `if:`
#     (the operator-owned mirror is not withastro; keeping it would skip the job)
#   - `release` job (push-triggered, not the TOCTOU surface) removed —
#     only snapshot-release carries the vulnerable mutable-ref checkout
#   - WASM / Go / build:compiler / release steps dropped — the sink is
#     `pnpm install` (lifecycle scripts), everything after is noise for the proof
#   - Upstream `getSnapshotName` step omitted — it validates `!preview <name>`
#     and only affects comment format; the TOCTOU sink is downstream. Dropping
#     it lets the operator post plain `!preview`.
#   - Admin gate, resolve-pr-refs (WITH its `token:` input — load-bearing),
#     checkout with head_ref: UNCHANGED. These are the vulnerable pattern.
name: Snapshot

on:
  issue_comment:
    types: [created]

jobs:
  snap:
    timeout-minutes: 3
    name: Snap
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '!preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Admin gate
        id: checkAccess
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103 # v2.3.0
        with:
          require: admin
          username: ${{ github.triggering_actor }}

      - name: Enforce admin
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "::error::not admin"
          exit 1

      - name: Resolve PR refs
        id: refs
        uses: eficode/resolve-pr-refs@f7e14e739786aae2053e162c678cd4c3c2edaa83
        # NOTE: `token:` is load-bearing — the action calls the GitHub REST
        # API to resolve the branch name for the PR referenced by this
        # issue_comment event. Omit and the step fails with
        # "Parameter token or opts.auth is required" before the vulnerable
        # checkout runs. Faithful to upstream withastro/compiler release.yml.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ steps.refs.outputs.head_ref }}
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.11.1

      - name: Install deps
        run: pnpm install
